<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssurIntellec Enquiry Service</title>
</head>
<body>
<script>
(function () {
  'use strict';

  // Apps Script HTML Service is sandboxed. Use window.top for replies so the
  // result can reach the actual website, even when Google inserts wrapper
  // frames around this HTML document.
  function reply(message) {
    try {
      window.top.postMessage(message, '*');
    } catch (_) {}
  }

  function normalizeRequest(raw) {
    try {
      const parsed = JSON.parse(String(raw || ''));
      if (!parsed || parsed.type !== 'assurintellec:submit') {
        return null;
      }
      return parsed;
    } catch (_) {
      return null;
    }
  }

  function handleRequest(request) {
    if (!request) return;

    const requestId = String(request.requestId || '');
    const bridgeToken = String(request.bridgeToken || '');
    if (!requestId || !bridgeToken) return;

    google.script.run
      .withSuccessHandler(function (result) {
        reply({
          type: 'assurintellec:result',
          requestId: requestId,
          bridgeToken: bridgeToken,
          result: result || {
            success: false,
            message: 'Empty response from enquiry service.'
          }
        });
      })
      .withFailureHandler(function (error) {
        reply({
          type: 'assurintellec:result',
          requestId: requestId,
          bridgeToken: bridgeToken,
          result: {
            success: false,
            message:
              error && error.message
                ? error.message
                : 'The enquiry service returned an error.'
          }
        });
      })
      .processEnquiry(request.payload || {});
  }

  // Legacy/fallback mode: if another client still uses postMessage to this
  // document, accept requests that target this bridge. Responses go directly
  // to the top-level website.
  window.addEventListener('message', function (event) {
    const message = event.data || {};

    if (message.type !== 'assurintellec:submit') {
      return;
    }

    handleRequest(message);
  }, false);

  // Preferred compatibility mode for sandboxed Apps Script deployments:
  // the website can place the request JSON into the iframe window name before
  // navigation, allowing this document to process it without relying on a
  // parent -> sandbox postMessage hop.
  handleRequest(normalizeRequest(window.name));
})();
</script>
</body>
</html>
