<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssurIntellec Enquiry Service</title>
</head>
<body>
<script>
(function () {
  'use strict';

  const ALLOWED_ORIGINS = new Set([
    'https://www.assurintellec.in',
    'https://assurintellec.in'
  ]);

  function reply(message) {
    try {
      window.parent.postMessage(
        message,
        '*'
      );
    } catch (_) {}
  }

  function isAllowedParent(event) {
    return (
      event.source === window.parent &&
      ALLOWED_ORIGINS.has(event.origin)
    );
  }

  reply({
    type: 'assurintellec:bridge-ready'
  });

  window.addEventListener(
    'message',
    function (event) {
      if (!isAllowedParent(event)) {
        return;
      }

      const message = event.data || {};

      if (
        message.type !==
        'assurintellec:submit'
      ) {
        return;
      }

      const requestId =
        String(message.requestId || '');

      if (!requestId) {
        return;
      }

      google.script.run
        .withSuccessHandler(
          function (result) {
            reply({
              type: 'assurintellec:result',
              requestId: requestId,
              result: result || {
                success: false,
                message: 'Empty response from enquiry service.'
              }
            });
          }
        )
        .withFailureHandler(
          function (error) {
            reply({
              type: 'assurintellec:result',
              requestId: requestId,
              result: {
                success: false,
                message:
                  error && error.message
                    ? error.message
                    : 'The enquiry service returned an error.'
              }
            });
          }
        )
        .processEnquiry(
          message.payload || {}
        );
    },
    false
  );
})();
</script>
</body>
</html>
