
name = "assurintellec"
main = "./maintenance-router.js"
compatibility_date = "2026-09-01"
workers_dev = true
keep_vars = true

previews = {}

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "VISITOR_COUNTER"
class_name = "VisitorCounter"

[[migrations]]
tag = "visitor-counter-v1"
new_sqlite_classes = ["VisitorCounter"]
