- label: Services
  name: services
  files:
  - label: All 7 Services
    name: all_services
    file: content/services.json
    format: json
    fields:
    - label: Service List
      name: services
      widget: list
      summary: '{{fields.title}}'
      fields:
      - label: Slug
        name: slug
        widget: string
        hint: Keep the existing slug unless you also rename the matching service-*.html file.
        required: false
      - label: Page File
        name: page_file
        widget: string
        hint: Existing service HTML file name. Keep unchanged unless you also rename the file.
        required: false
      - label: Title
        name: title
        widget: string
        required: false
      - label: Icon Class
        name: icon
        widget: string
        required: false
      - label: Short Description
        name: description
        widget: text
        required: false
      - label: Card Bullet Points (for future use)
        name: card_bullets
        widget: list
        field:
          label: Bullet
          name: bullet
          widget: string
          required: false
        required: false
      - label: Page Eyebrow
        name: page_eyebrow
        widget: string
        required: false
      - label: Page Title
        name: page_title
        widget: string
        required: false
      - label: Page Description
        name: page_description
        widget: text
        required: false
      - label: Intro Heading
        name: intro_title
        widget: string
        required: false
      - label: Intro Text
        name: intro
        widget: text
        required: false
      - label: Show This Service
        name: enabled
        widget: boolean
        default: true
        required: false
      - label: Opening Media Mode — VIDEO (first on service page)
        name: hero_media_type
        widget: select
        options: [image, video]
        default: video
        hint: The FIRST section of each service page uses its opening video whenever a video file is set. For image-only mode, clear the opening video file first.
        required: false
      - label: Opening Video Poster / Fallback Image (16:9)
        name: hero_image
        widget: image
        required: false
        hint: Video poster and image-mode fallback. Use unique 16:9 original-resolution image; the video remains at the top unless you switch Hero Media Type.
      - label: Original File Upload for hero_image (extra extensions; no recompression)
        name: hero_image_original
        widget: file
        media_folder: images/uploads
        public_folder: /images/uploads
        required: false
        hint: Optional. Overrides the standard image field; selects an original file of any extension. Browser image support and backend upload limits apply. Use 16:9 for full-frame display.

      - label: OPENING VIDEO (FIRST ON SERVICE PAGE) — Auto-play H.264 MP4
        name: hero_video
        widget: file
        media_folder: videos
        public_folder: /videos
        required: false
        hint: "This field controls the FIRST video after clicking a service. Use MP4 with H.264 video and AAC audio, preferably 16:9. Upload, Save, and Publish. It autoplays muted, with optional visitor sound. HEVC/MOV/AVI may not play. Hosting upload size limits apply. For manual edits, change hero_video in content/services.json; see the included guide."
      - label: HOMEPAGE SERVICE IMAGE (16:9) — unique picture with service text
        name: listing_image
        widget: image
        required: false
        hint: Shown on HOME and the Services listing with the service text. It is NOT the opening video. Each default service uses its own 16:9 PNG. For your replacements, upload 16:9 JPG, PNG or WebP at your preferred resolution; Decap processing is disabled.
      - label: Services Listing Original Image — additional extensions
        name: listing_image_original
        widget: file
        media_folder: images/uploads
        public_folder: /images/uploads
        required: false
