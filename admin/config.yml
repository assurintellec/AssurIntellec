        widget: color
        allowInput: true
        default: '#e6cf74'
        required: false
      - label: Hero Animated Heading Text Color
        name: heading_text_color
        widget: color
        allowInput: true
        default: '#ffffff'
        required: false
      - label: Hero Description Text Color
        name: description_text_color
        widget: color
        allowInput: true
        default: '#ffffff'
        required: false
      - label: Animated Service Heading Enabled
        name: service_cycle_enabled
        widget: boolean
        default: true
        required: false
        hint: Types each configured service title, erases it, and repeats continuously.
      - label: Animated Service Titles (up to 7)
        name: service_cycle_titles
        widget: list
        field:
          label: Service Title
          name: title
          widget: string
          required: false
        required: false
        min: 0
        max: 7
        allow_add: true
        allow_delete: true
        allow_remove: true
      required: false
    - label: Homepage
      name: home
      widget: object
      collapsed: true
      fields:
