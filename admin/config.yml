            widget: text
        - label: Button
          name: button
          widget: string
          required: false
          default: About Us
        - label: Button url
          name: button_url
          widget: string
          required: false
          default: ./about.html
    - label: Expert Team — 10 Editable Profiles
      name: expert_team
