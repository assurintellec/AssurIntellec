        name: items
        widget: list
        summary: '{{fields.label}}'
        fields:
        - label: Key
          name: key
          widget: string
        - label: Label
          name: label
          widget: string
        - label: URL
          name: url
          widget: string
        - label: Font Awesome Icon Class
          name: icon
          widget: string
        - label: CSS Color Class (optional)
          name: class_name
          widget: string
          required: false
        - label: Header Icon Color
          name: header_color
          widget: color
          allowInput: true
          default: '#111111'
        - label: Footer Icon Color
          name: footer_color
          widget: color
          allowInput: true
          default: '#ffffff'
        - label: Enabled
          name: enabled
          widget: boolean
          default: true
