publish_mode: simple
backend:
  name: turbo-github
  turbo_site_id: 970e4e24-dfda-4ae1-beec-118e1dc52488
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
# Save uploaded pixels and metadata as supplied. The site displays them responsively, never replaces originals.
media_processing:
  enabled: false
site_url: https://www.assurintellec.in
display_url: https://www.assurintellec.in
collections:
- label: Site Settings
  name: site_settings
  files:
  - label: Complete Website Settings
    name: settings
    file: content/site.json
    format: json
    fields:
    - label: Newsletter & Subscriptions
      name: newsletter
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Enable Newsletter Section
        name: enabled
        widget: boolean
        required: false
        default: true
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
        default: NEWSLETTER & SERVICE UPDATES
      - label: Title
        name: title
        widget: string
        required: false
        default: Stay connected with AssurIntellec™
      - label: Description
        name: description
        widget: string
        required: false
        default: Choose the service updates you want to receive, including news, insights and opportunities.
      - label: Email Label
        name: email_label
        widget: string
        required: false
        default: Email address
      - label: Email Placeholder
        name: email_placeholder
        widget: string
        required: false
        default: you@example.com
      - label: Interest Label
        name: interest_label
        widget: string
        required: false
        default: Updates you are interested in
      - label: Interest Placeholder
        name: interest_placeholder
        widget: string
        required: false
        default: Choose your interest
      - label: All Services Label
        name: all_services_label
        widget: string
        required: false
        default: All service updates
      - label: Include All Service Updates Option
        name: include_all_services
        widget: boolean
        required: false
        default: true
      - label: Consent Label
        name: consent_label
        widget: string
        required: false
        default: I agree to receive the selected updates from AssurIntellec. I can unsubscribe at any time.
      - label: Submit Label
        name: submit_label
        widget: string
        required: false
        default: Subscribe
      - label: Submitting Label
        name: submitting_label
        widget: string
        required: false
        default: Saving…
      - label: Success Message
        name: success_message
        widget: string
        required: false
        default: Thank you! Your email and selected interest have been saved.
      - label: Error Message
        name: error_message
        widget: string
        required: false
        default: We could not confirm your subscription. Please try again or contact us.
      - label: Setup Message
        name: setup_message
        widget: string
        required: false
        default: Newsletter subscriptions will open soon.
      - label: Privacy Note
        name: privacy_note
        widget: text
        required: false
        default: We use your email for the updates you select. You can unsubscribe or contact our team to opt out.
      - label: Newsletter Google Apps Script Web App URL
        name: google_apps_script_url
        widget: string
        required: false
        default: ''
        hint: Deploy integrations/newsletter/Code.gs in your dedicated newsletter Google Sheet, then paste the public
          /exec URL here. This is separate from the enquiry form URL.
    - label: Website Search & Chatbot
      name: site_tools
      widget: object
      collapsed: true
      required: false
      fields:
      - label: Enable Top Search Bar
        name: search_enabled
        widget: boolean
        required: false
        default: true
      - label: Search Caption
        name: search_caption
        widget: string
        required: false
        default: Find your solution
      - label: Search Label
        name: search_label
        widget: string
        required: false
        default: Search website
      - label: Search Placeholder
        name: search_placeholder
        widget: string
        required: false
        default: Search services, expertise or contact…
      - label: Search Button Label
        name: search_button_label
        widget: string
        required: false
        default: Search
      - label: Search Empty
        name: search_empty
        widget: string
        required: false
        default: No matching pages found. Try a service name or contact us.
      - label: Maximum Search Results
        name: search_result_limit
        widget: number
        required: false
        default: 6
        value_type: int
        min: 3
        max: 10
      - label: Enable Floating Chatbot
        name: chatbot_enabled
        widget: boolean
        required: false
        default: true
      - label: Chatbot Title
        name: chatbot_title
        widget: string
        required: false
        default: AssurIntellec™ Assistant
      - label: Chatbot Subtitle
        name: chatbot_subtitle
        widget: string
        required: false
        default: Website service guide
      - label: Chatbot Launcher Label
        name: chatbot_launcher_label
        widget: string
        required: false
        default: Chat with AssurIntellec
      - label: Chatbot Welcome
        name: chatbot_welcome
        widget: text
        required: false
        default: Hello! I can help you explore our services, find information and contact the right team. What would
          you like to know?
      - label: Chatbot Placeholder
        name: chatbot_placeholder
        widget: string
        required: false
        default: Ask about services or your requirement…
      - label: Chatbot Send Label
        name: chatbot_send_label
        widget: string
        required: false
        default: Send
      - label: Chatbot Close Label
        name: chatbot_close_label
        widget: string
        required: false
        default: Close chat
      - label: Chatbot Reset Label
        name: chatbot_reset_label
        widget: string
        required: false
        default: New chat
      - label: Chatbot Enquiry Label
        name: chatbot_enquiry_label
        widget: string
        required: false
        default: Send an enquiry
      - label: Chatbot Topics Label
        name: chatbot_topics_label
        widget: string
        required: false
        default: Popular questions
      - label: Chatbot Footer Note
        name: chatbot_footer_note
        widget: string
        required: false
        default: Use the enquiry form to send your requirement to our team.
      - label: Chatbot Not Found
        name: chatbot_not_found
        widget: text
        required: false
        default: I couldn’t find an answer in the website information. Please use the enquiry form so the team can assist
          with your requirement.
      - label: Chatbot Pricing Answer
        name: chatbot_pricing_answer
        widget: text
        required: false
        default: Prices are not listed in the website information. Please send your project requirements through the
          enquiry form to request a quotation.
      - label: Chatbot Hours Answer
        name: chatbot_hours_answer
        widget: text
        required: false
        default: Working hours are not listed in the website information. Please contact the team to confirm availability.
      - label: Chatbot Quick Questions
        name: chatbot_quick_questions
        widget: list
        required: false
        min: 0
        max: 6
        default:
        - question: What services do you offer?
        - question: Help with cleanroom and HVAC planning
        - question: How can I contact you?
        - question: I need a quotation
        fields:
        - label: Question
          name: question
          widget: string
      - label: Custom Chatbot Answers
        name: chatbot_faqs
        widget: list
        required: false
        summary: '{{fields.question}}'
        fields:
        - label: Enabled
          name: enabled
          widget: boolean
          default: true
          required: false
        - label: Question
          name: question
          widget: string
        - label: Matching Keywords
          name: keywords
          widget: string
          required: false
          hint: Optional comma-separated words or phrases. A matching phrase uses this answer.
        - label: Answer
          name: answer
          widget: text
        - label: Link Label
          name: link_label
          widget: string
          required: false
        - label: Link URL
          name: link_url
          widget: string
          required: false
          hint: 'Use a website .html page path, a full https:// URL, mailto: or tel: link.'
    - label: Company Name
      name: company_name
      widget: string
      required: false
    - label: Brand Subtitle
      name: brand_subtitle
      widget: string
      required: false
    - label: Tagline
      name: tagline
      widget: string
      required: false
    - label: SEO
      name: seo
      widget: object
      collapsed: true
      fields:
      - label: Schema / Google Search Logo URL (optional override)
        name: logo_url
        widget: string
        required: false
        hint: Optional full URL override. Leave blank to use the uploaded Google Search / Organization Logo in Media
          Assets. Google decides whether to show a logo in Search.
      - label: Page Title
        name: title
        widget: string
        required: false
      - label: Meta Description
        name: description
        widget: text
        required: false
      - label: Canonical Base URL
        name: canonical_base
        widget: string
        hint: Official canonical domain used for page SEO.
        required: false
      required: false
    - label: Visitor Counter
      name: visitor_counter
      widget: object
      collapsed: true
      fields:
      - label: Enabled
        name: enabled
        widget: boolean
        default: true
        required: false
      - label: Display Label
        name: label
        widget: string
        required: false
      - label: Counter Namespace
        name: namespace
        widget: string
        hint: Keep this stable to preserve the website visitor count across website file replacements.
        required: false
      - label: Counter Action
        name: action
        widget: string
        default: view
        required: false
      - label: Counter Key
        name: key
        widget: string
        hint: Keep this stable across normal updates. Change only when intentionally starting a fresh counter; use
          Starting Value to carry forward the last displayed total.
        required: false
      - label: Starting Value / Carry-Forward Offset
        name: start_value
        widget: number
        value_type: int
        min: 0
        default: 0
        required: false
        hint: Added to the persistent live visit count. For example 148160 plus 12 new visits displays 148172.
          Keep namespace, action and key unchanged to retain visits after website updates. A fresh key starts at this value.
      required: false
    - label: Navigation
      name: navigation
      widget: object
      collapsed: true
      fields:
      - label: Home
        name: home
        widget: string
        required: false
      - label: About Us
        name: about
        widget: string
        required: false
      - label: Services
        name: services
        widget: string
        required: false
      - label: Why Us
        name: why_us
        widget: string
        required: false
      - label: Contact Us
        name: contact
        widget: string
        required: false
      required: false
    - label: Social Media
      name: social
      widget: object
      collapsed: true
      fields:
      - label: Social Links (drag to change order)
        name: items
        widget: list
        summary: '{{fields.label}}'
        fields:
        - label: Key
          name: key
          widget: string
          required: false
        - label: Label
          name: label
          widget: string
          required: false
        - label: URL
          name: url
          widget: string
          hint: Edit this URL to change the social profile or channel link in both the header and footer.
          required: false
        - label: Font Awesome Icon Class
          name: icon
          widget: string
          required: false
        - label: CSS Color Class (optional)
          name: class_name
          widget: string
          required: false
        - label: Header Icon Color
          name: header_color
          widget: color
          allowInput: true
          default: '#111111'
          required: false
        - label: Footer Icon Color
          name: footer_color
          widget: color
          allowInput: true
          default: '#ffffff'
          required: false
        - label: Enabled
          name: enabled
          widget: boolean
          default: true
          required: false
        min: 0
        max: 12
        allow_add: true
        allow_delete: true
        allow_remove: true
        required: false
      required: false
    - label: Footer Content
      name: footer
      widget: object
      collapsed: true
      fields:
      - label: Footer Description
        name: description
        widget: text
        required: false
      - label: Quick Links Heading
        name: quick_links_title
        widget: string
        required: false
      - label: Services Heading
        name: services_title
        widget: string
        required: false
      - label: Contact Heading
        name: contact_title
        widget: string
        required: false
      - label: Social Heading
        name: social_title
        widget: string
        required: false
      - label: Copyright Text
        name: copyright
        widget: string
        required: false
      required: false
    - label: Page-Level Text
      name: pages
      widget: object
      collapsed: true
      fields:
      - label: Services Page
        name: services
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
          required: false
        - label: Page Title
          name: title
          widget: string
          required: false
        - label: Page Description
          name: description
          widget: text
          required: false
        required: false
      - label: Why Us Page
        name: why_us
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
          required: false
        - label: Page Title
          name: title
          widget: string
          required: false
        - label: Page Description
          name: description
          widget: text
          required: false
        required: false
      required: false
    - label: Contact & Enquiry
      name: contact
      widget: object
      collapsed: true
      fields:
      - label: Office Phone
        name: phone
        widget: string
        hint: Main office number shown on the website.
        required: false
      - label: Office Phone Label
        name: phone_label
        widget: string
        required: false
      - label: Mobile Phone
        name: mobile_phone
        widget: string
        required: false
      - label: Mobile Phone Label
        name: mobile_phone_label
        widget: string
        required: false
      - label: Public Email
        name: email
        widget: string
        required: false
      - label: Website
        name: website
        widget: string
        required: false
      - label: Website Display Text
        name: website_display
        widget: string
        hint: Visible website text, for example www.assurintellec.in. The Website field remains the clickable URL.
        required: false
      - label: WhatsApp Link
        name: whatsapp
        widget: string
        required: false
      - label: WhatsApp Phone Number
        name: whatsapp_phone
        widget: string
        required: false
        hint: International digits only, e.g. 917600666436. Used by the pre-filled enquiry WhatsApp button.
      - label: Enquiry Recipient Email
        name: enquiry_recipient_email
        widget: string
        hint: Email address used by the Apps Script enquiry notification.
        required: false
      - label: Service Page Contact Label
        name: service_contact_label
        widget: string
        required: false
      - label: Service Page Contact Email
        name: service_contact_email
        widget: string
        hint: Shown at the bottom of every individual service page.
        required: false
      - label: Google Apps Script Web App URL
        name: google_apps_script_url
        widget: string
        required: false
        hint: Paste the deployed /exec Web App URL. The production website uses a secure iframe bridge to avoid
          browser CORS limitations.
      - label: Customer Confirmation Email Enabled
        name: customer_confirmation_email_enabled
        widget: boolean
        default: true
        hint: Sends an automatic confirmation email to the customer after a successful enquiry submission.
        required: false
      - label: Customer Confirmation From Email
        name: customer_confirmation_email_from_email
        widget: string
        hint: Must be configured as a Gmail 'Send mail as' alias for the Google account running the Apps Script.
        required: false
      - label: Customer Confirmation Email Subject
        name: customer_confirmation_email_subject
        widget: string
        required: false
      - label: Customer Confirmation Email Message
        name: customer_confirmation_email_message
        widget: text
        hint: 'Editable main message template. Supported placeholders: {name}, {company}, {email}, {phone}, {service},
          {message}, {reference}, and {services}. The branded signature, contact details and logo are added automatically
          from the published Site Settings / Media Assets, so the logo can be changed through Decap CMS.'
        required: false
      - label: Page Eyebrow
        name: page_eyebrow
        widget: string
        required: false
      - label: Page Title
        name: page_title
        widget: string
        required: false
      - label: Page Description
        name: page_description
        widget: text
        required: false
      - label: Contact Heading
