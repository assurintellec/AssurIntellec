backend:
  name: turbo-github
  turbo_site_id: 970e4e24-dfda-4ae1-beec-118e1dc52488
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
site_url: https://www.assurintellec.in
display_url: https://www.assurintellec.in
collections:
- label: Site Settings
  name: site_settings
  files:
  - label: Complete Website Settings
    name: settings
    file: content/site.json
    format: json
    fields:
    - label: Company Name
      name: company_name
      widget: string
    - label: Brand Subtitle
      name: brand_subtitle
      widget: string
    - label: Tagline
      name: tagline
      widget: string
    - label: SEO
      name: seo
      widget: object
      collapsed: true
      fields:
      - label: Schema / Google Search Logo URL
        name: logo_url
        widget: string
        required: false
        default: https://www.assurintellec.in/images/google-logo-512.png
        hint: Crawlable full brand logo used in Organization structured data. Google decides whether to show it in Search.
      - label: Page Title
        name: title
        widget: string
      - label: Meta Description
        name: description
        widget: text
      - label: Canonical Base URL
        name: canonical_base
        widget: string
        hint: Official canonical domain used for page SEO.
    - label: Visitor Counter
      name: visitor_counter
      widget: object
      collapsed: true
      fields:
      - label: Enabled
        name: enabled
        widget: boolean
        default: true
      - label: Display Label
        name: label
        widget: string
      - label: Counter Namespace
        name: namespace
        widget: string
        hint: Stable CounterAPI namespace. Keep the same value once published.
      - label: Counter Action
        name: action
        widget: string
        default: view
      - label: Counter Key
        name: key
        widget: string
        hint: Stable CounterAPI key used for the whole website visitor count.
    - label: Navigation
      name: navigation
      widget: object
      collapsed: true
      fields:
      - label: Home
        name: home
        widget: string
      - label: About Us
        name: about
        widget: string
      - label: Services
        name: services
        widget: string
      - label: Why Us
        name: why_us
        widget: string
      - label: Contact Us
        name: contact
        widget: string
    - label: Social Media
      name: social
      widget: object
      collapsed: true
      fields:
      - label: Social Links (drag to change order)
        name: items
        widget: list
        summary: '{{fields.label}}'
        fields:
        - label: Key
          name: key
          widget: string
        - label: Label
          name: label
          widget: string
        - label: URL
          name: url
          widget: string
        - label: Font Awesome Icon Class
          name: icon
          widget: string
        - label: CSS Color Class (optional)
          name: class_name
          widget: string
          required: false
        - label: Header Icon Color
          name: header_color
          widget: color
          allowInput: true
          default: '#111111'
        - label: Footer Icon Color
          name: footer_color
          widget: color
          allowInput: true
          default: '#ffffff'
        - label: Enabled
          name: enabled
          widget: boolean
          default: true
    - label: Contact & Enquiry
      name: contact
      widget: object
      collapsed: true
      fields:
      - label: Office Phone
        name: phone
        widget: string
        hint: Main office number shown on the website.
      - label: Office Phone Label
        name: phone_label
        widget: string
      - label: Mobile Phone
        name: mobile_phone
        widget: string
        required: false
      - label: Mobile Phone Label
        name: mobile_phone_label
        widget: string
        required: false
      - label: Public Email
        name: email
        widget: string
      - label: Website
        name: website
        widget: string
      - label: Website Display Text
        name: website_display
        widget: string
        hint: Visible website text, for example www.assurintellec.in. The Website field remains the clickable URL.
      - label: WhatsApp Link
        name: whatsapp
        widget: string
      - label: WhatsApp Phone Number
        name: whatsapp_phone
        widget: string
        required: false
        hint: International digits only, e.g. 917600666436. Used by the pre-filled enquiry WhatsApp button.
      - label: Enquiry Recipient Email
        name: enquiry_recipient_email
        widget: string
        hint: Email address used by the Apps Script enquiry notification.
      - label: Service Page Contact Label
        name: service_contact_label
        widget: string
      - label: Service Page Contact Email
        name: service_contact_email
        widget: string
        hint: Shown at the bottom of every individual service page.
      - label: Google Apps Script Web App URL
        name: google_apps_script_url
        widget: string
        required: false
        hint: Paste the deployed /exec Web App URL. The production website uses a secure iframe bridge to avoid browser CORS limitations.
      - label: Customer Confirmation Email Enabled
        name: customer_confirmation_email_enabled
        widget: boolean
        default: true
        hint: Sends an automatic confirmation email to the customer after a successful enquiry submission.
      - label: Customer Confirmation From Email
        name: customer_confirmation_email_from_email
        widget: string
        hint: Must be configured as a Gmail 'Send mail as' alias for the Google account running the Apps Script.
      - label: Customer Confirmation Email Subject
        name: customer_confirmation_email_subject
        widget: string
      - label: Customer Confirmation Email Message
        name: customer_confirmation_email_message
        widget: text
        hint: "Editable main message template. Supported placeholders: {name}, {company}, {email}, {phone}, {service}, {message}, {reference}, and {services}. The branded signature, contact details and logo are added automatically from the published Site Settings / Media Assets, so the logo can be changed through Decap CMS."
      - label: Page Eyebrow
        name: page_eyebrow
        widget: string
      - label: Page Title
        name: page_title
        widget: string
      - label: Page Description
        name: page_description
        widget: text
      - label: Contact Heading
        name: heading
        widget: string
      - label: Contact Description
        name: description
        widget: text
      - label: Form Title
        name: form_title
        widget: string
      - label: Name Label
        name: form_name_label
        widget: string
      - label: Company Label
        name: form_company_label
        widget: string
      - label: Email Label
        name: form_email_label
        widget: string
      - label: Phone Label
        name: form_phone_label
        widget: string
      - label: Requirement Label
        name: form_service_label
        widget: string
      - label: Message Label
        name: form_message_label
        widget: string
      - label: Name Placeholder
        name: form_name_placeholder
        widget: string
      - label: Company Placeholder
        name: form_company_placeholder
        widget: string
      - label: Email Placeholder
        name: form_email_placeholder
        widget: string
      - label: Phone Placeholder
        name: form_phone_placeholder
        widget: string
      - label: Message Placeholder
        name: form_message_placeholder
        widget: string
      - label: Submit Button
        name: form_button
        widget: string
      - label: Website Label
        name: website_label
        widget: string
      - label: Email Label (Contact Card)
        name: email_label
        widget: string
      - label: WhatsApp Label
        name: whatsapp_label
        widget: string
      - label: WhatsApp Link Text
        name: whatsapp_text
        widget: string
      - label: Success Message
        name: enquiry_success_message
        widget: string
      - label: Success Title
        name: enquiry_success_title
        widget: string
        hint: Centre confirmation title shown after a successful enquiry.
      - label: Success Received Line
        name: enquiry_success_received
        widget: string
      - label: Success Review Message
        name: enquiry_success_body
        widget: text
      - label: Success Closing Line
        name: enquiry_success_closing
        widget: string
      - label: Success Tagline
        name: enquiry_success_tagline
        widget: string
      - label: Success Close Label
        name: enquiry_success_close_label
        widget: string
      - label: Error Message
        name: enquiry_error_message
        widget: text
      - label: WhatsApp Prefill Template
        name: whatsapp_prefill_template
        widget: text
        hint: 'Available fields: {name}, {company}, {email}, {phone}, {service}, {message}'
      - label: Form Service Placeholder
        name: form_service_placeholder
        widget: string
        required: false
        default: Select requirement
      - label: Form Validation Message
        name: form_validation_message
        widget: string
        required: false
      - label: Form Sending Text
        name: form_sending_text
        widget: string
        required: false
      - label: Enquiry Subject
        name: enquiry_subject
        widget: string
        required: false
    - label: Hero
      name: hero
      widget: object
      collapsed: true
      fields:
      - label: Hero Company Name
        name: company_name
        widget: string
      - label: Kicker
        name: kicker
        widget: string
      - label: Heading
        name: heading
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Hero Video
        name: video
        widget: file
        required: false
        media_folder: videos
        public_folder: /videos
      - label: Hero Poster / Fallback Image
        name: poster
        widget: image
        required: false
      - label: Primary Button Text
        name: button_primary
        widget: string
      - label: Primary Button URL
        name: button_primary_url
        widget: string
      - label: Secondary Button Text
        name: button_secondary
        widget: string
      - label: Secondary Button URL
        name: button_secondary_url
        widget: string
      - label: Sound Button Label
        name: video_sound_label
        widget: string
      - label: Mute Button Label
        name: video_mute_label
        widget: string
      - label: Audio On by Default
        name: video_audio_default_enabled
        widget: boolean
        default: true
        hint: The hero video starts with audio requested by default. Browsers may block autoplay with sound; in that case it starts muted until the visitor enables audio.
      - label: Autoplay
        name: video_autoplay
        widget: boolean
        default: true
      - label: Loop
        name: video_loop
        widget: boolean
        default: true
      - label: Hero Video Alt Text
        name: video_alt
        widget: string
        required: false
      - label: Hero Poster Alt Text
        name: poster_alt
        widget: string
        required: false
    - label: Homepage
      name: home
      widget: object
      collapsed: true
      fields:
      - label: Trust Strip
        name: trust_items
        widget: list
        summary: '{{fields.title}}'
        fields:
        - label: Icon
          name: icon
          widget: string
        - label: Title
          name: title
          widget: string
        - label: Supporting Text
          name: text
          widget: string
      - label: Certificates & Approvals Logos (6)
        name: approval_logos
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Section Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
          required: false
        - label: Six Logos (all 6 visible at once)
          name: items
          widget: list
          min: 6
          max: 6
          allow_add: false
          allow_remove: false
          allow_reorder: true
          summary: '{{fields.title}}'
          fields:
          - label: Logo / Certificate Image
            name: image
            widget: image
            media_folder: images/uploads
            public_folder: /images/uploads
          - label: Display Name
            name: title
            widget: string
          - label: Alt Text
            name: alt
            widget: string

      - label: Valuable Customer Logos (5)
        name: client_logos
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Section Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
          required: false
        - label: Five Customer Logos
          name: items
          widget: list
          min: 5
          max: 5
          allow_add: false
          allow_remove: false
          allow_reorder: true
          summary: '{{fields.title}}'
          fields:
          - label: Customer Logo
            name: image
            widget: image
            media_folder: images/uploads
            public_folder: /images/uploads
          - label: Company / Display Name
            name: title
            widget: string
          - label: Alt Text
            name: alt
            widget: string
      - label: Testimonials (3 cards shown at once)
        name: testimonials
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Section Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
          required: false
        - label: Google Reviews Link
          name: google_link
          widget: string
          hint: Opens your existing Google reviews page. Keep this as your AssurIntellec Google review link.
        - label: Google Button Label
          name: google_link_label
          widget: string
          default: Read all reviews on Google
        - label: Three Testimonials
          name: items
          widget: list
          min: 3
          max: 3
          allow_add: false
          allow_remove: false
          allow_reorder: true
          summary: '{{fields.name}} — {{fields.company}}'
          fields:
          - label: Rating
            name: rating
            widget: number
            value_type: int
            min: 1
            max: 5
            default: 5
          - label: Testimonial Text
            name: text
            widget: text
          - label: Customer Name
            name: name
            widget: string
          - label: Company Name
            name: company
            widget: string
          - label: Customer Photo (optional)
            name: avatar
            widget: image
            required: false
            media_folder: images/uploads
            public_folder: /images/uploads
      - label: Why Us Page
        name: why_us
        widget: object
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
    - label: Section Visibility
      name: section_visibility
      widget: object
      collapsed: true
      fields:
      - label: Header Social Icons
        name: header_social
        widget: boolean
        default: true
      - label: Footer Social Icons
        name: footer_social
        widget: boolean
        default: true
      - label: Homepage Trust Strip
        name: trust_strip
        widget: boolean
        default: true
      - label: Homepage Certificates & Approvals Logos
        name: approval_logos_home
        widget: boolean
        default: true
      - label: Homepage Valuable Customer Logos
        name: client_logos_home
        widget: boolean
        default: true
      - label: Homepage Testimonials
        name: testimonials_home
        widget: boolean
        default: true
      - label: Homepage About + Reel
        name: about_reel_home
        widget: boolean
        default: true
      - label: Homepage Services Preview
        name: services_preview_home
        widget: boolean
        default: true
      - label: Homepage Why Us Preview
        name: why_preview_home
        widget: boolean
        default: true
      - label: Homepage CTA
        name: home_cta
        widget: boolean
        default: true
      - label: Floating WhatsApp
        name: floating_whatsapp
        widget: boolean
        default: true
    - label: User Interface Text
      name: ui
      widget: object
      collapsed: true
      fields:
      - label: Menu Open Label
        name: menu_open_label
        widget: string
      - label: Menu Close Label
        name: menu_close_label
        widget: string
      - label: Service Open ARIA Label
        name: service_read_aria
        widget: string
      - label: Service Back Label
        name: service_back_label
        widget: string
      - label: Instagram Viewer ARIA Label
        name: instagram_viewer_label
        widget: string
      - label: Profile Placeholder Title
        name: profile_placeholder_title
        widget: string
      - label: Profile Placeholder Help
        name: profile_placeholder_help
        widget: text
      - label: Contact Service Placeholder
        name: contact_select_placeholder
        widget: string
    - label: Custom CSS (Advanced)
      name: custom_css
      widget: code
      default_language: css
      required: false
      hint: Optional advanced customization. Normal design controls are available under Theme & Layout.
    - label: Editor Notes
      name: editor_notes
      widget: object
      collapsed: true
      fields:
      - label: Instructions
        name: instructions
        widget: text
        required: false
      - label: Instagram Viewer Note
        name: instagram_viewer
        widget: text
        required: false
- label: Services
  name: services
  files:
  - label: All 7 Services
    name: all_services
    file: content/services.json
    format: json
    fields:
    - label: Service List
      name: services
      widget: list
      summary: '{{fields.title}}'
      fields:
      - label: Slug
        name: slug
        widget: string
        hint: Keep the existing slug unless you also rename the matching service-*.html file.
      - label: Page File
        name: page_file
        widget: string
        hint: Existing service HTML file name. Keep unchanged unless you also rename the file.
      - label: Title
        name: title
        widget: string
      - label: Icon Class
        name: icon
        widget: string
      - label: Short Description
        name: description
        widget: text
      - label: Card Bullet Points (for future use)
        name: card_bullets
        widget: list
        field:
          label: Bullet
          name: bullet
          widget: string
      - label: Page Eyebrow
        name: page_eyebrow
        widget: string
      - label: Page Title
        name: page_title
        widget: string
      - label: Page Description
        name: page_description
        widget: text
      - label: Intro Heading
        name: intro_title
        widget: string
      - label: Intro Text
        name: intro
        widget: text
      - label: Service Photo 1
        name: image_1
        widget: image
        required: false
      - label: Photo 1 Alt Text
        name: image_1_alt
        widget: string
      - label: Photo 1 Caption
        name: gallery_caption_1
        widget: string
      - label: Photo 1 Supporting Text
        name: image_1_text
        widget: text
      - label: Service Photo 2
        name: image_2
        widget: image
        required: false
      - label: Photo 2 Alt Text
        name: image_2_alt
        widget: string
      - label: Photo 2 Caption
        name: gallery_caption_2
        widget: string
      - label: Photo 2 Supporting Text
        name: image_2_text
        widget: text
      - label: Detail Sections
        name: sections
        widget: list
        summary: '{{fields.heading}}'
        fields:
        - label: Section Heading
          name: heading
          widget: string
        - label: Paragraphs
          name: paragraphs
          widget: list
          field:
            label: Paragraph
            name: paragraph
            widget: text
        - label: Bullet Points
          name: bullets
          widget: list
          field:
            label: Bullet
            name: bullet
            widget: string
      - label: Contact Button Text
        name: cta
        widget: string
      - label: Contact Button URL
        name: cta_url
        widget: string
        required: false
        default: ./contact.html
      - label: Optional Service Video
        name: service_video
        widget: file
        required: false
        media_folder: videos
        public_folder: /videos
