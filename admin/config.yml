        default: 0.38
        required: false
      - label: Hero Video Shade Spread / Length (%)
        name: overlay_spread
        widget: number
        value_type: int
        min: 0
        max: 95
        step: 5
        default: 45
        hint: Controls how far the solid shade extends from the left before fading toward the right edge.
