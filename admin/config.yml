backend:
  name: turbo-github
  turbo_site_id: 970e4e24-dfda-4ae1-beec-118e1dc52488
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
site_url: https://www.assurintellec.in
display_url: https://www.assurintellec.in
collections:
- label: Site Settings
  name: site_settings
  files:
  - label: Complete Website Settings
    name: settings
    file: content/site.json
    format: json
    fields:
    - label: Company Name
      name: company_name
      widget: string
    - label: Brand Subtitle
      name: brand_subtitle
      widget: string
    - label: Tagline
      name: tagline
      widget: string
    - label: Branding & Loading Splash
      name: branding
      widget: object
      collapsed: true
      fields:
      - label: Enable Loading Splash
        name: splash_enabled
        widget: boolean
        default: true
      - label: Splash Display Time (ms)
        name: splash_display_ms
        widget: number
        value_type: int
        min: 0
        max: 2500
        default: 950
      - label: Splash Fade-out Time (ms)
        name: splash_fade_ms
        widget: number
        value_type: int
        min: 0
        max: 1200
        default: 360
      - label: Animate Header Logo Entrance
        name: header_logo_animation
        widget: boolean
        default: true
      - label: Enable Logo-Shaped Gold/Blue Light Sweep
        name: header_logo_sheen
        widget: boolean
        default: true
        hint: Adds a restrained light sweep masked to the transparent logo artwork; it does not distort or redraw the logo.
      - label: Logo Light Sweep Interval (ms)
        name: header_logo_sheen_interval_ms
        widget: number
        value_type: int
        min: 4000
        max: 15000
        default: 6800
        required: false
    - label: SEO
      name: seo
      widget: object
      collapsed: true
      fields:
      - label: Schema / Google Search Logo URL
        name: logo_url
        widget: string
        required: false
        default: https://www.assurintellec.in/images/uploads/logo_transparent_png_tm.png
        hint: Crawlable full brand logo used in Organization structured data. Google decides whether to show it in Search.
      - label: Page Title
        name: title
        widget: string
      - label: Meta Description
        name: description
        widget: text
      - label: Canonical Base URL
        name: canonical_base
        widget: string
        hint: Official canonical domain used for page SEO.
    - label: Website Visitor Counter
      name: visitor_counter
      widget: object
      collapsed: true
      fields:
      - label: Enable Visitor Counter
        name: enabled
        widget: boolean
        default: true
      - label: Starting Visitor Count
        name: starting_count
        widget: number
        value_type: int
        min: 0
        default: 0
        hint: Used only when first initializing the server count or when Baseline Reset Version is changed. This does not
          store the live total.
      - label: Visitor Counter Label
        name: label
        widget: string
        default: Website Visitors
      - label: Display Position
        name: display_position
        widget: select
        options:
        - label: Footer bottom (current position)
          value: footer-bottom
        - label: Footer contact area
          value: footer-contact
        - label: Floating bottom-left
          value: floating
        default: footer-bottom
      - label: Counting Policy
        name: counting_policy
        widget: select
        options:
        - label: One count per browser tab session (recommended)
          value: session
        - label: One count per browser per day
          value: daily_browser
        default: session
        hint: This is an approximate visit unit, not an exact count of individual people. Refreshes are deduplicated by the
          server.
      - label: Baseline Reset Date / Version
        name: baseline_version
        widget: string
        required: false
        default: ''
        hint: Leave blank to let the backend try a one-time import from the previous CounterAPI total. To intentionally reset,
          set Starting Visitor Count and change this value to a new unique version/date, then publish.
      - label: Number Format
        name: number_format
        widget: select
        options:
        - label: Thousands separators (12,850)
          value: thousands
        - label: Plain number (12850)
          value: plain
        default: thousands
      - label: Counter Animation
        name: counter_animation
        widget: boolean
        default: true
      - label: Counter Animation Duration (ms)
        name: animation_duration_ms
        widget: number
        value_type: int
        min: 0
        max: 2000
        default: 500
      - label: Legacy Counter Namespace (migration only)
        name: namespace
        widget: string
        required: false
        default: assurintellec.in
        hint: Used only once if the backend needs to import the previous CounterAPI total.
      - label: Legacy Counter Action (migration only)
        name: action
        widget: string
        required: false
        default: view
      - label: Legacy Counter Key (migration only)
        name: key
        widget: string
        required: false
        default: website-visitors
      - label: Try importing legacy counter once
        name: legacy_import_enabled
        widget: boolean
        default: true
    - label: Global Animation System
      name: motion
      widget: object
      collapsed: true
      fields:
      - label: Enable Global Animations
        name: enabled
        widget: boolean
        default: true
      - label: Animation Intensity
        name: intensity
        widget: select
        options:
        - label: Subtle and premium
          value: subtle
        - label: Standard
          value: standard
        default: subtle
      - label: Entrance Duration (ms)
        name: duration_ms
        widget: number
        value_type: int
        min: 150
        max: 1400
        default: 620
      - label: Stagger Between Cards (ms)
        name: stagger_ms
        widget: number
        value_type: int
        min: 0
        max: 250
        default: 65
    - label: Navigation
      name: navigation
      widget: object
      collapsed: true
      fields:
      - label: Home
        name: home
        widget: string
      - label: About Us
        name: about
        widget: string
      - label: Services
        name: services
        widget: string
      - label: Why Us
        name: why_us
        widget: string
      - label: Contact Us
        name: contact
        widget: string
    - label: Social Media
      name: social
      widget: object
      collapsed: true
      fields:
      - label: Social Links (drag to change order)
        name: items
        widget: list
        summary: '{{fields.label}}'
        fields:
        - label: Key
          name: key
          widget: string
        - label: Label
          name: label
          widget: string
        - label: URL
          name: url
          widget: string
        - label: Font Awesome Icon Class
          name: icon
          widget: string
        - label: CSS Color Class (optional)
          name: class_name
          widget: string
          required: false
        - label: Header Icon Color
          name: header_color
          widget: color
          allowInput: true
          default: '#111111'
        - label: Footer Icon Color
          name: footer_color
          widget: color
          allowInput: true
          default: '#ffffff'
        - label: Enabled
          name: enabled
          widget: boolean
          default: true
    - label: Contact & Enquiry
      name: contact
      widget: object
      collapsed: true
      fields:
      - label: Office Phone
        name: phone
        widget: string
        hint: Main office number shown on the website.
      - label: Office Phone Label
        name: phone_label
        widget: string
      - label: Mobile Phone
        name: mobile_phone
        widget: string
        required: false
      - label: Mobile Phone Label
        name: mobile_phone_label
        widget: string
        required: false
      - label: Public Email
        name: email
        widget: string
      - label: Website
        name: website
        widget: string
      - label: Website Display Text
        name: website_display
        widget: string
        hint: Visible website text, for example www.assurintellec.in. The Website field remains the clickable URL.
      - label: WhatsApp Link
        name: whatsapp
        widget: string
      - label: WhatsApp Phone Number
        name: whatsapp_phone
        widget: string
        required: false
        hint: International digits only, e.g. 917600666436. Used by the pre-filled enquiry WhatsApp button.
      - label: Enquiry Recipient Email
        name: enquiry_recipient_email
        widget: string
        hint: Email address used by the Apps Script enquiry notification.
      - label: Service Page Contact Label
        name: service_contact_label
        widget: string
      - label: Service Page Contact Email
        name: service_contact_email
        widget: string
        hint: Shown at the bottom of every individual service page.
      - label: Google Apps Script Web App URL
        name: google_apps_script_url
        widget: string
        required: false
        hint: Existing deployed Google Apps Script /exec URL. This endpoint handles enquiries and the persistent visitor counter;
          keep the same deployment URL when publishing a new script version.
      - label: Customer Confirmation Email Enabled
        name: customer_confirmation_email_enabled
        widget: boolean
        default: true
        hint: Sends an automatic confirmation email to the customer after a successful enquiry submission.
      - label: Customer Confirmation From Email
        name: customer_confirmation_email_from_email
        widget: string
        hint: The mail Worker must authenticate using this same verified sender mailbox. It cannot truthfully send from this
          address unless TITAN_SMTP_USER is configured to this address.
      - label: Customer Confirmation Email Subject
        name: customer_confirmation_email_subject
        widget: string
      - label: Customer Confirmation Email Message
        name: customer_confirmation_email_message
        widget: text
        hint: 'Editable main message template. Supported placeholders: {name}, {company}, {email}, {phone}, {service}, {message},
          {reference}, and {services}. The branded signature, contact details and logo are added automatically from the published
          Site Settings / Media Assets, so the logo can be changed through Decap CMS.'
      - label: Page Eyebrow
        name: page_eyebrow
        widget: string
      - label: Page Title
        name: page_title
        widget: string
      - label: Page Description
        name: page_description
        widget: text
      - label: Contact Heading
        name: heading
        widget: string
      - label: Contact Description
        name: description
        widget: text
      - label: Form Title
        name: form_title
        widget: string
      - label: Name Label
        name: form_name_label
        widget: string
      - label: Company Label
        name: form_company_label
        widget: string
      - label: Email Label
        name: form_email_label
        widget: string
      - label: Phone Label
        name: form_phone_label
        widget: string
      - label: Requirement Label
        name: form_service_label
        widget: string
      - label: Message Label
        name: form_message_label
        widget: string
      - label: Name Placeholder
        name: form_name_placeholder
        widget: string
      - label: Company Placeholder
        name: form_company_placeholder
        widget: string
      - label: Email Placeholder
        name: form_email_placeholder
        widget: string
      - label: Phone Placeholder
        name: form_phone_placeholder
        widget: string
      - label: Message Placeholder
        name: form_message_placeholder
        widget: string
      - label: Submit Button
        name: form_button
        widget: string
      - label: Website Label
        name: website_label
        widget: string
      - label: Email Label (Contact Card)
        name: email_label
        widget: string
      - label: WhatsApp Label
        name: whatsapp_label
        widget: string
      - label: WhatsApp Link Text
        name: whatsapp_text
        widget: string
      - label: Success Message
        name: enquiry_success_message
        widget: string
      - label: Success Title
        name: enquiry_success_title
        widget: string
        hint: Centre confirmation title shown after a successful enquiry.
      - label: Success Received Line
        name: enquiry_success_received
        widget: string
      - label: Success Review Message
        name: enquiry_success_body
        widget: text
      - label: Success Closing Line
        name: enquiry_success_closing
        widget: string
      - label: Success Tagline
        name: enquiry_success_tagline
        widget: string
      - label: Success Close Label
        name: enquiry_success_close_label
        widget: string
      - label: Error Message
        name: enquiry_error_message
        widget: text
      - label: WhatsApp Prefill Template
        name: whatsapp_prefill_template
        widget: text
        hint: 'Available fields: {name}, {company}, {email}, {phone}, {service}, {message}'
      - label: Form Service Placeholder
        name: form_service_placeholder
        widget: string
        required: false
        default: Select requirement
      - label: Form Validation Message
        name: form_validation_message
        widget: string
        required: false
      - label: Form Sending Text
        name: form_sending_text
        widget: string
        required: false
      - label: Enquiry Subject
        name: enquiry_subject
        widget: string
        required: false
    - label: Hero
      name: hero
      widget: object
      collapsed: true
      fields:
      - label: Hero Company Name
        name: company_name
        widget: string
      - label: Kicker
        name: kicker
        widget: string
      - label: Heading
        name: heading
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Hero Video
        name: video
        widget: file
        required: false
        media_folder: /videos
        public_folder: /videos
      - label: Hero Poster / Fallback Image
        name: poster
        widget: image
        required: false
      - label: Make Hero Background Clickable
        name: poster_click_enabled
        widget: boolean
        default: false
      - label: Hero Background Click URL
        name: poster_click_url
        widget: string
        required: false
      - label: Open Hero Background Link in New Tab
        name: poster_click_new_tab
        widget: boolean
        default: true
      - label: Primary Button Text
        name: button_primary
        widget: string
      - label: Primary Button URL
        name: button_primary_url
        widget: string
      - label: Secondary Button Text
        name: button_secondary
        widget: string
      - label: Secondary Button URL
        name: button_secondary_url
        widget: string
      - label: Sound Button Label
        name: video_sound_label
        widget: string
      - label: Mute Button Label
        name: video_mute_label
        widget: string
      - label: Audio On by Default
        name: video_audio_default_enabled
        widget: boolean
        default: true
        hint: The hero video starts with audio requested by default. Browsers may block autoplay with sound; in that case
          it starts muted until the visitor enables audio.
      - label: Autoplay
        name: video_autoplay
        widget: boolean
        default: true
      - label: Loop
        name: video_loop
        widget: boolean
        default: true
      - label: Hero Video Alt Text
        name: video_alt
        widget: string
        required: false
      - label: Hero Poster Alt Text
        name: poster_alt
        widget: string
        required: false
    - label: Homepage
      name: home
      widget: object
      collapsed: true
      fields:
      - label: Trust Strip
        name: trust_items
        widget: list
        summary: '{{fields.title}}'
        fields:
        - label: Icon
          name: icon
          widget: string
        - label: Title
          name: title
          widget: string
        - label: Supporting Text
          name: text
          widget: string
      - label: Instagram Reel Viewer Settings
        name: instagram_section
        widget: object
        collapsed: true
        fields:
        - label: Enabled
          name: enabled
          widget: boolean
          default: true
          required: false
        - label: Prev label
          name: prev_label
          widget: string
          required: false
          default: Previous Instagram Reel
        - label: Next label
          name: next_label
          widget: string
          required: false
          default: Next Instagram Reel
        - label: Empty message
          name: empty_message
          widget: text
          required: false
          default: Upload an authorized MP4 video or add a public Instagram Reel URL in Decap CMS.
      - label: Certificates & Approvals Logos (6)
        name: approval_logos
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Section Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
          required: false
        - label: Six Logos (all 6 visible at once)
          name: items
          widget: list
          min: 6
          max: 6
          allow_add: false
          allow_remove: false
          allow_reorder: true
          summary: '{{fields.title}}'
          fields:
          - label: Logo / Certificate Image
            name: image
            widget: image
            hint: Upload any PNG, JPG or WebP. You do not need to rename the file; saving the entry updates the image reference
              automatically.
          - label: Display Name
            name: title
            widget: string
          - label: Alt Text
            name: alt
            widget: string
          - label: Make this image clickable
            name: click_enabled
            widget: boolean
            default: false
          - label: Image Click URL
            name: click_url
            widget: string
            required: false
          - label: Open Link in New Tab
            name: click_new_tab
            widget: boolean
            default: true
      - label: Valuable Customer Logos (5)
        name: client_logos
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Section Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
          required: false
        - label: Five Customer Logos
          name: items
          widget: list
          min: 5
          max: 5
          allow_add: false
          allow_remove: false
          allow_reorder: true
          summary: '{{fields.title}}'
          fields:
          - label: Customer Logo
            name: image
            widget: image
            hint: Upload any PNG, JPG or WebP. You do not need to rename the file; saving the entry updates the image reference
              automatically.
          - label: Company / Display Name
            name: title
            widget: string
          - label: Alt Text
            name: alt
            widget: string
          - label: Make this image clickable
            name: click_enabled
            widget: boolean
            default: false
          - label: Image Click URL
            name: click_url
            widget: string
            required: false
          - label: Open Link in New Tab
            name: click_new_tab
            widget: boolean
            default: true
      - label: Testimonials (3 cards shown at once)
        name: testimonials
        widget: object
        collapsed: true
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Section Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
          required: false
        - label: Google Reviews Link
          name: google_link
          widget: string
          hint: Opens your existing Google reviews page. Keep this as your AssurIntellec Google review link.
        - label: Google Button Label
          name: google_link_label
          widget: string
          default: Read all reviews on Google
        - label: Three Testimonials
          name: items
          widget: list
          min: 3
          max: 3
          allow_add: false
          allow_remove: false
          allow_reorder: true
          summary: '{{fields.name}} — {{fields.company}}'
          fields:
          - label: Rating
            name: rating
            widget: number
            value_type: int
            min: 1
            max: 5
            default: 5
          - label: Testimonial Text
            name: text
            widget: text
          - label: Customer Name
            name: name
            widget: string
          - label: Company Name
            name: company
            widget: string
          - label: Customer Photo (optional)
            name: avatar
            widget: image
            required: false
            hint: Upload any PNG, JPG or WebP. The three testimonial photos are editable here and can also be replaced directly
              in GitHub.
          - label: Make Customer Photo Clickable
            name: avatar_click_enabled
            widget: boolean
            default: false
          - label: Customer Photo Click URL
            name: avatar_click_url
            widget: string
            required: false
          - label: Open Photo Link in New Tab
            name: avatar_click_new_tab
            widget: boolean
            default: true
      - label: Why Us Page
        name: why_us
        widget: object
        fields:
        - label: Eyebrow
          name: eyebrow
          widget: string
        - label: Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
      - label: Services Preview
        name: services_preview
        widget: object
        collapsed: true
        fields:
