        allow_add: false
        allow_remove: false
        allow_reorder: true
        summary: '{{fields.order}} — {{fields.name}}'
        fields:
        - label: Enable Profile
          name: enabled
          widget: boolean
          default: false
        - label: Serial Number / Display Order
          name: order
          widget: number
          value_type: int
          min: 1
          max: 100
          default: 1
        - label: Expert Name
          name: name
          widget: string
          required: false
        - label: Professional Designation
          name: designation
          widget: string
          required: false
        - label: Short Introduction
          name: short_intro
          widget: text
          required: false
        - label: Profile Image / Illustration
          name: image
          widget: image
          required: false
          hint: Upload a real approved profile photograph or an illustrative placeholder. Avoid presenting a generic illustration
            as a real photograph.
        - label: Image Alternative Text
          name: image_alt
