backend:
  name: turbo-github
  turbo_site_id: 970e4e24-dfda-4ae1-beec-118e1dc52488
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
site_url: https://www.assurintellec.in
display_url: https://www.assurintellec.in
collections:
- label: Site Settings
  name: site_settings
  files:
  - label: Complete Website Settings
    name: settings
    file: content/site.json
    format: json
    fields:
    - label: Company Name
      name: company_name
      widget: string
    - label: Brand Subtitle
      name: brand_subtitle
      widget: string
    - label: Tagline
      name: tagline
      widget: string
    - label: SEO
      name: seo
      widget: object
      collapsed: true
      fields:
      - label: Page Title
        name: title
        widget: string
      - label: Meta Description
        name: description
        widget: text
    - label: Navigation
      name: navigation
      widget: object
      collapsed: true
      fields:
      - label: Home
        name: home
        widget: string
      - label: About Us
        name: about
        widget: string
      - label: Services
        name: services
        widget: string
      - label: Why Us
        name: why_us
        widget: string
      - label: Contact Us
        name: contact
        widget: string
    - label: Social Media
      name: social
      widget: object
      collapsed: true
