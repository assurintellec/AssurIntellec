  <title>AssurIntellec™ Content Manager</title>

<body>
  <!-- Pin the Decap Turbo beta build. Tracking @beta can silently switch to a new build and introduce regressions. -->

    src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0-beta.3/dist/decap-cms.js"
    onerror="this.onerror=null;this.src='https://unpkg.com/decap-cms@3.17.0-beta.3/dist/decap-cms.js';"
  ></script>
</body>
</html>
