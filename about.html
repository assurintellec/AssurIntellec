<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssurIntellec™</title>
  <meta name="description" content="AssurIntellec™">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body data-page="about">
<div id="site-header"></div>
<main>
  <section class="page-hero"><div class="container"><div class="eyebrow" id="aboutEyebrow"></div><h1 id="aboutPageTitle"></h1><p id="aboutPageDescription"></p></div></section>
  <section class="section">
    <div class="container profile-about">
      <aside class="profile-card">
        <div class="passport-photo-frame">
          <img id="profilePhoto" src="" alt="">
          <div id="profilePhotoPlaceholder" class="profile-photo-placeholder">
            <i class="fas fa-user"></i><span>Upload profile photo</span><small>Use Decap CMS → Site Settings → About Us</small>
          </div>
        </div>
        <div class="profile-card-info"><h3 id="profileName"></h3><p id="profilePosition"></p></div>
      </aside>
      <div class="about-profile-details">
        <div id="aboutMainText"></div>
        <div class="profile-detail-box">
          <h3 id="aboutApproachTitle"></h3>
          <p class="approach-flow" id="aboutApproachFlow"></p>
        </div>
        <div class="about-closing" id="aboutClosing"></div>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<div id="whatsappFloat"></div>
<script src="./assets/site.js"></script>
</body>
</html>
