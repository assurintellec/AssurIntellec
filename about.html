<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssurIntellec™</title>
  <meta name="description" content="AssurIntellec™">
  <meta property="og:image" content="https://www.assurintellec.in/images/favicon-512.png">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/images/favicon-192.png">
  <link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="https://www.assurintellec.in/about.html">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/site.css?v=20261029-1">
  <link rel="stylesheet" href="./assets/premium-motion.css?v=20261029-1">
  <link rel="stylesheet" href="./assets/site-assistant.css?v=20261029-6">
  <link rel="stylesheet" href="./assets/newsletter.css?v=20261029-5">
  <link rel="stylesheet" href="./assets/site-enhancements.css?v=20261030-1">
</head>
<body data-page="about">
<script src="./assets/site-preloader.js?v=20261030-1"></script>
<div id="site-header"></div>
<main>
  <section class="page-hero"><div class="container"><div class="eyebrow" id="aboutEyebrow"></div><h1 id="aboutPageTitle"></h1><p id="aboutPageDescription"></p></div></section>
  <section class="section">
    <div class="container profile-about">
      <aside class="profile-card">
        <div class="profile-card-label" id="profileCardLabel"></div>
        <div class="passport-photo-frame">
          <img id="profilePhoto" src="" alt="">
          <div id="profilePhotoPlaceholder" class="profile-photo-placeholder"><i class="fas fa-user"></i><span></span><small></small></div>
        </div>
        <div class="profile-card-info">
          <h3 id="profileName"></h3>
          <p id="profilePosition"></p>
          <div class="profile-contact">
            <a id="profilePhone" href="#" aria-label="Profile mobile number">
              <i class="fas fa-mobile-screen-button" aria-hidden="true"></i>
              <span id="profilePhoneText"></span>
            </a>
            <a id="profileEmail" href="#" aria-label="Profile email">
              <i class="fas fa-envelope" aria-hidden="true"></i>
              <span id="profileEmailText"></span>
            </a>
          </div>
        </div>
      </aside>
      <div class="about-profile-details">
        <div id="aboutMainText"></div>
        <div class="profile-detail-box"><h3 id="aboutApproachTitle"></h3><p class="approach-flow" id="aboutApproachFlow"></p></div>
        <div class="about-closing" id="aboutClosing"></div>
      </div>
    </div>
  </section>
  <section class="section expert-team-section" id="expertTeamSection" style="display:none">
    <div class="container">
      <div class="section-heading compact-heading">
        <span class="eyebrow" id="expertTeamEyebrow">AssurIntellec™</span>
        <h2 id="expertTeamTitle">Expert Team</h2>
        <p id="expertTeamDescription"></p>
      </div>
      <div class="expert-grid" id="expertGrid"></div>
    </div>
  </section>
</main>
<div class="expert-profile-overlay" id="expertProfileOverlay" aria-hidden="true">
  <div class="expert-profile-dialog" role="dialog" aria-modal="true" aria-labelledby="expertProfileTitle" tabindex="-1">
    <button type="button" class="expert-profile-close" id="expertProfileClose" aria-label="Close expert profile"><i class="fas fa-xmark" aria-hidden="true"></i></button>
    <div id="expertProfileContent"></div>
  </div>
</div>
<div id="site-footer"></div>
<div id="whatsappFloat"></div>
<div id="siteToast" class="site-toast" role="status" aria-live="polite"></div>
<script src="./assets/site-assistant.js?v=20261029-6"></script>
<script src="./assets/newsletter.js?v=20261030-1"></script>
<script src="./assets/site.js?v=20261030-1"></script>
</body>
</html>
