<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssurIntellec™</title>
  <meta name="description" content="AssurIntellec™">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
  <section class="hero" id="home">
    <video class="hero-bg-video" id="heroVideo" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
      <source id="heroVideoSource" src="" type="video/mp4">
    </video>
    <img class="hero-bg-fallback" id="heroImage" src="" alt="">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <div class="hero-company" id="heroCompany"></div>
      <div class="hero-kicker" id="heroKicker"></div>
      <h1 id="heroHeading"></h1>
      <p id="heroDescription"></p>
      <div class="hero-buttons">
        <a class="btn btn-primary" id="heroPrimaryButton" href="./services.html"></a>
        <a class="btn btn-outline" id="heroSecondaryButton" href="./contact.html"></a>
      </div>
    </div>
    <button class="hero-sound" id="heroSound" type="button" aria-label="Enable hero video sound" title="Enable hero video sound"><i class="fas fa-volume-xmark"></i></button>
  </section>

  <section class="trust-strip"><div class="container trust-grid" id="trustGrid"></div></section>

  <section class="pharma-visual-section">
    <div class="container pharma-visual-grid">
      <div class="pharma-visual-copy">
        <div class="eyebrow" id="instagramEyebrow"></div>
        <p id="instagramDescription"></p>
        <a class="text-link" id="instagramProfileLink" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div class="instagram-carousel" aria-label="Instagram Reel viewer">
        <button class="instagram-arrow" id="instagramPrev" type="button"><i class="fas fa-chevron-left"></i></button>
        <div class="instagram-reel-wrap" id="instagramReel"></div>
        <button class="instagram-arrow" id="instagramNext" type="button"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </section>

  <section class="section" id="about-preview">
    <div class="container about-grid">
      <div class="about-images">
        <div class="about-image"><img id="aboutPreviewImage1" src="" alt=""></div>
        <div class="about-image"><img id="aboutPreviewImage2" src="" alt=""></div>
      </div>
      <div class="about-content">
        <div class="eyebrow" id="aboutPreviewEyebrow"></div>
        <h2 id="aboutPreviewTitle"></h2>
        <p id="aboutPreviewText"></p>
        <div class="about-points" id="aboutPreviewPoints"></div>
        <a class="btn btn-primary dark-btn" id="aboutPreviewButton" href="./about.html"></a>
      </div>
    </div>
  </section>

  <section class="section section-light">
    <div class="container">
      <div class="section-heading compact-heading">
        <span class="eyebrow" id="servicesPreviewEyebrow"></span>
        <h2 id="servicesPreviewTitle"></h2>
        <p id="servicesPreviewDescription"></p>
      </div>
      <div class="services-grid" id="servicesGrid"></div>
      <div class="center-action"><a class="btn btn-primary dark-btn" href="./services.html" id="servicesPreviewButton"></a></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-heading compact-heading">
        <span class="eyebrow" id="whyPreviewEyebrow"></span>
        <h2 id="whyPreviewTitle"></h2>
        <p id="whyPreviewDescription"></p>
      </div>
      <div class="why-grid" id="whyPreviewGrid"></div>
      <div class="center-action"><a class="btn btn-primary dark-btn" href="./why-us.html" id="whyPreviewButton"></a></div>
    </div>
  </section>

  <section class="cta">
    <div class="container cta-inner">
      <div><h2 id="homeCtaTitle"></h2><p id="homeCtaText"></p></div>
      <a class="btn btn-primary" href="./contact.html" id="homeCtaButton"></a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<div id="whatsappFloat"></div>
<script src="./assets/site.js"></script>
</body>
</html>
