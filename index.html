<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssurIntellec™</title>
  <meta name="description" content="AssurIntellec™">
  <meta property="og:image" content="https://www.assurintellec.in/images/favicon-512.png">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/images/favicon-192.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" as="image" href="/images/google-logo-512.png">
<script id="organizationSchema" type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"AssurIntellec™",
    "alternateName":"AssurIntellec",
    "url":"https://www.assurintellec.in/",
    "logo":"https://www.assurintellec.in/images/favicon-512.png",
    "image":"https://www.assurintellec.in/images/favicon-512.png",
    "email":"info@assurintellec.in",
    "telephone":"+91 7600 666 436",
    "address":{
      "@type":"PostalAddress",
      "streetAddress":"88 to 92, Gate No. 3, Siddhivinayak Industrial Estate, Opp. Opera Palace, Laskana - Kholvad Road",
      "addressLocality":"Kholvad",
      "addressRegion":"Gujarat",
      "postalCode":"394190",
      "addressCountry":"IN"
    }
  }
  </script>
  <link rel="canonical" href="https://www.assurintellec.in/">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
  <section class="hero" id="home">
    <video class="hero-bg-video" id="heroVideo" autoplay muted loop playsinline preload="metadata" aria-hidden="true"></video>
    <img class="hero-bg-fallback" id="heroImage" src="" alt="">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <div class="hero-company" id="heroCompany"></div>
      <div class="hero-kicker" id="heroKicker"></div>
      <h1 id="heroHeading"></h1>
      <p id="heroDescription"></p>
      <div class="hero-buttons">
        <a class="btn btn-primary" id="heroPrimaryButton" href="./services.html"></a>
        <a class="btn btn-outline" id="heroSecondaryButton" href="./contact.html"></a>
      </div>
    </div>
    <button class="hero-sound" id="heroSound" type="button" aria-label="Mute hero video" title="Mute hero video"><i class="fas fa-volume-high"></i></button>
  </section>

  <section class="trust-strip"><div class="container trust-grid" id="trustGrid"></div></section>

  <section class="section about-reel-section" id="about-preview">
    <div class="container about-reel-grid">
      <div class="about-content about-home-copy">
        <div class="eyebrow" id="aboutPreviewEyebrow"></div>
        <h2 id="aboutPreviewTitle"></h2>
        <p id="aboutPreviewText"></p>
        <div class="about-points" id="aboutPreviewPoints"></div>
        <a class="btn btn-primary dark-btn" id="aboutPreviewButton" href="./about.html"></a>
      </div>
      <div class="instagram-carousel home-instagram" aria-label="Instagram Reel viewer">
        <button class="instagram-arrow" id="instagramPrev" type="button"><i class="fas fa-chevron-left"></i></button>
        <div class="instagram-reel-wrap"><div id="instagramReel"></div></div>
        <button class="instagram-arrow" id="instagramNext" type="button"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </section>

  <section class="section section-light home-services-preview">
    <div class="container">
      <div class="section-heading compact-heading">
        <span class="eyebrow" id="servicesPreviewEyebrow"></span>
        <h2 id="servicesPreviewTitle"></h2>
        <p id="servicesPreviewDescription"></p>
      </div>
      <div class="services-grid service-title-grid" id="servicesGrid"></div>
      <div class="center-action"><a class="btn btn-primary dark-btn" href="./services.html" id="servicesPreviewButton"></a></div>
    </div>
  </section>

  <section class="section logo-showcase-section approval-showcase-section" id="approval-logos-home">
    <div class="container">
      <div class="section-heading compact-heading">
        <span class="eyebrow" id="approvalLogosEyebrow"></span>
        <h2 id="approvalLogosTitle"></h2>
        <p id="approvalLogosDescription"></p>
      </div>
      <div class="logo-showcase-grid approval-logo-grid" id="approvalLogosGrid" aria-label="Certificates and approvals"></div>
    </div>
  </section>

  <section class="section logo-showcase-section client-showcase-section" id="client-logos-home">
    <div class="container">
      <div class="section-heading compact-heading">
        <span class="eyebrow" id="clientLogosEyebrow"></span>
        <h2 id="clientLogosTitle"></h2>
        <p id="clientLogosDescription"></p>
      </div>
      <div class="logo-showcase-grid client-logo-grid" id="clientLogosGrid"></div>
    </div>
  </section>

  <section class="section testimonials-section" id="testimonials-home">
    <div class="container">
      <div class="section-heading compact-heading testimonials-heading">
        <span class="eyebrow" id="testimonialsEyebrow"></span>
        <h2 id="testimonialsTitle"></h2>
        <p id="testimonialsDescription"></p>
      </div>
      <div class="testimonials-grid" id="testimonialsGrid" aria-label="Customer testimonials"></div>
      <div class="testimonials-google-action">
        <a class="google-reviews-button" id="testimonialsGoogleLink" href="#" target="_blank" rel="noopener noreferrer">
          <span class="google-g-mark small">G</span>
          <span id="testimonialsGoogleLinkLabel"></span>
        </a>
      </div>
    </div>
  </section>

  <section class="section home-why-preview">
    <div class="container">
      <div class="section-heading compact-heading">
        <span class="eyebrow" id="whyPreviewEyebrow"></span>
        <h2 id="whyPreviewTitle"></h2>
        <p id="whyPreviewDescription"></p>
      </div>
      <div class="why-grid" id="whyPreviewGrid"></div>
      <div class="center-action"><a class="btn btn-primary dark-btn" href="./why-us.html" id="whyPreviewButton"></a></div>
    </div>
  </section>

  <section class="cta home-cta">
    <div class="container cta-inner">
      <div><h2 id="homeCtaTitle"></h2><p id="homeCtaText"></p></div>
      <a class="btn btn-primary" href="./contact.html" id="homeCtaButton"></a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<div id="whatsappFloat"></div>
<div id="siteToast" class="site-toast" role="status" aria-live="polite"></div>
<script src="./assets/site.js"></script>
</body>
</html>
