<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssurIntellec™</title>
  <meta name="description" content="AssurIntellec™">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main>
  <section class="page-hero"><div class="container"><div class="eyebrow" id="contactEyebrow"></div><h1 id="contactPageTitle"></h1><p id="contactPageDescription"></p></div></section>
  <section class="section">
    <div class="container contact-grid">
      <div class="contact-info">
        <h2 id="contactHeading"></h2><p id="contactDescription"></p>
        <div class="contact-items" id="contactItems"></div>
      </div>
      <form class="contact-form" id="contactForm">
        <h3 id="contactFormTitle"></h3>
        <div class="form-grid">
          <div class="form-group"><label id="labelName" for="name"></label><input id="name" name="Name" type="text" required></div>
          <div class="form-group"><label id="labelCompany" for="company"></label><input id="company" name="Company" type="text"></div>
          <div class="form-group"><label id="labelEmail" for="email"></label><input id="email" name="Email" type="email" required></div>
          <div class="form-group"><label id="labelPhone" for="phone"></label><input id="phone" name="Phone" type="tel"></div>
          <div class="form-group full"><label id="labelService" for="service"></label><select id="service" name="Requirement"></select></div>
          <div class="form-group full"><label id="labelMessage" for="message"></label><textarea id="message" name="Message" required></textarea></div>
          <div class="form-group full"><button class="btn btn-primary dark-btn" type="submit" id="contactSubmitButton"></button></div>
        </div>
      </form>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<div id="whatsappFloat"></div>
<script src="./assets/site.js"></script>
</body>
</html>
