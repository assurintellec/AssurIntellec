<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AssurIntellec™</title>
  <meta name="description" content="AssurIntellec™">
  <meta name="theme-color" content="#0b1f3a">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link rel="stylesheet" href="./assets/site.css">
</head>

<body data-page="contact">

  <!-- Header -->
  <div id="site-header"></div>

  <main>

    <!-- Contact Page Hero -->
    <section class="page-hero">
      <div class="container">

        <div
          class="eyebrow"
          id="contactEyebrow">
        </div>

        <h1 id="contactPageTitle"></h1>

        <p id="contactPageDescription"></p>

      </div>
    </section>


    <!-- Contact Section -->
    <section class="section">

      <div class="container contact-grid">

        <!-- Contact Information -->
        <div class="contact-info">

          <h2 id="contactHeading"></h2>

          <p id="contactDescription"></p>

          <div
            class="contact-items"
            id="contactItems">
          </div>

        </div>


        <!-- Enquiry Form -->
        <form
          class="contact-form"
          id="contactForm"
          novalidate
        >

          <h3 id="contactFormTitle"></h3>

          <div class="form-grid">

            <!-- Name -->
            <div class="form-group">

              <label
                for="name"
                id="labelName">
              </label>

              <input
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                required
              >

            </div>


            <!-- Company -->
            <div class="form-group">

              <label
                for="company"
                id="labelCompany">
              </label>

              <input
                id="company"
                name="company"
                type="text"
                autocomplete="organization"
              >

            </div>


            <!-- Email -->
            <div class="form-group">

              <label
                for="email"
                id="labelEmail">
              </label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              >

            </div>


            <!-- Phone -->
            <div class="form-group">

              <label
                for="phone"
                id="labelPhone">
              </label>

              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
              >

            </div>


            <!-- Service / Requirement -->
            <div class="form-group full">

              <label
                for="service"
                id="labelService">
              </label>

              <select
                id="service"
                name="service"
                required
              >
              </select>

            </div>


            <!-- Message -->
            <div class="form-group full">

              <label
                for="message"
                id="labelMessage">
              </label>

              <textarea
                id="message"
                name="message"
                required
              ></textarea>

            </div>


            <!-- Buttons -->
            <div class="form-group full contact-form-actions">

              <!-- Email + Google Sheet -->
              <button
                type="submit"
                class="btn btn-primary dark-btn"
                id="contactSubmitButton"
              >
                Send Enquiry
              </button>


              <!-- WhatsApp -->
              <button
                type="button"
                class="btn whatsapp-form-button"
                id="contactWhatsAppButton"
                aria-label="Send enquiry on WhatsApp"
              >
                <i class="fab fa-whatsapp" aria-hidden="true"></i>
                Send on WhatsApp
              </button>

            </div>

          </div>

        </form>

      </div>

    </section>

  </main>


  <!-- Footer -->
  <div id="site-footer"></div>


  <!-- Floating WhatsApp -->
  <div id="whatsappFloat"></div>


  <!-- Toast notification -->
  <div
    id="siteToast"
    class="site-toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- Main JavaScript -->
  <script src="./assets/site.js"></script>

</body>
</html>
